[package]
name = "rngd-kernels"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.furiosa-opt]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(backend, values("emulation", "npu", "typecheck"))', 'cfg(furiosa_opt)'] }

[lib]
name = "rngd_kernels"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "constant_add"
path = "src/constant_add.rs"

[dependencies]
eyre = "0.6"
furiosa-opt-std = "=0.10.0"
rand = "0.9"
tokio = { version = "1.29", features = ["rt", "rt-multi-thread", "sync", "macros"] }
